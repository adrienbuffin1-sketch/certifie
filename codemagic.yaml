# Codemagic builds the iPhone app in the cloud (no Mac needed) and sends it to TestFlight.
# Uses the same App Store Connect API key as Lumen Deep and Mandala Pop ("LumenDeepKey").
workflows:
  register-bundle-id:
    # One-off: registers com.certifie.app with Apple through the API key (run once before the first build).
    name: Certifié - register bundle ID
    max_build_duration: 10
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: LumenDeepKey
    scripts:
      - name: Register com.certifie.app
        script: |
          app-store-connect bundle-ids list --bundle-id-identifier com.certifie.app --strict-match-identifier || true
          app-store-connect bundle-ids create com.certifie.app --name "Certifie" --platform IOS || echo "Already registered or not created - see the line above"
          app-store-connect bundle-ids list --bundle-id-identifier com.certifie.app --strict-match-identifier
  ios-testflight:
    name: Certifié - iOS TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: LumenDeepKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.certifie.app
      vars:
        # App Store Connect > Certifié > App Information > Apple ID (fill in after creating the app)
        APP_STORE_APPLE_ID: 6835843029
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install packages
        script: npm install
      - name: Add the iOS project
        script: npx cap add ios
      - name: App icon and splash screen
        script: npx @capacitor/assets generate --ios --iconBackgroundColor '#152a63' --splashBackgroundColor '#152a63' --splashBackgroundColorDark '#0c1838'
      - name: Copy the app in
        script: npx cap sync ios
      - name: iPhone only, portrait, name, no export compliance questions
        script: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL" || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PL"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PL" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Certifié" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Certifié" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool false" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool true" "$PL" || true
          # Google AdMob: app ID, tracking prompt text, Google's SKAdNetwork ID
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string ca-app-pub-3111717712336403~4972475591" "$PL" || true
          /usr/libexec/PlistBuddy -c "Delete :NSUserTrackingUsageDescription" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string This lets us show you ads that are more relevant to you. The app works the same either way." "$PL"
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" "$PL" || true
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
            # the AdMob plugin (v6) is written for Google's consent SDK 2.x; 3.x renamed its API
            perl -0pi -e "s/(target 'App' do\n)/\$1  pod 'GoogleUserMessagingPlatform', '~> 2.7'\n/" ios/App/Podfile
            cd ios/App && rm -f Podfile.lock && pod install --repo-update && cd ../..
          fi
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
          agvtool new-marketing-version 1.0.0
      - name: Build the app
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
